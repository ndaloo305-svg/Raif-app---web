name: Validate RAIF Web

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["build/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check UI bindings and browser-key safety
        run: npm run validate
